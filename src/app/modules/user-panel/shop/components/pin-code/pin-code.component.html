<div class="pin-code-dialog"> 
    <p class="title">
        Verify pin code
    </p>
    <div class="form">
        <mat-form-field appearance="outline">
            <mat-label>Insert pin code</mat-label>
            <input matInput [formControl]="pinCode" type="password" autocomplete="off">
          </mat-form-field>
      </div>
</div>
