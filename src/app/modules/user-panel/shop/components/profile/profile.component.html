<div class="profile">
  <div class="container">
    <p class="back-button"><span (click)="backStep()">Back</span></p>
    <div *ngIf="userInfo">
      <div class="fields" *ngIf="userEmail">
        <p> {{userEmail}}</p>
      </div>
      <div class="fields">
        <p> {{userName}}</p>
      </div>
      <div class="fields">
        <p> {{userInfo?.profile.company}}</p>
      </div>
      <div class="fields" *ngIf="userInfo?.profile.timezone_data">
        <p> {{userInfo?.profile.timezone_data?.code}}</p>
      </div>
      <div class="sign-out">
        <img src="/assets/images/icons/ic_sign_out.png" (click)="singOut()" />
        <p (click)="singOut()">Sign Out</p>
      </div>
    </div>
  </div>
</div>
