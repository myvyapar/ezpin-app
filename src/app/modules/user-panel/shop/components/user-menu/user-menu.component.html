<div class="user-menu">
  <div class="container">
    <div class="menu">
        <div class="user-info">
            <img class="user-profile" defaultImage="/assets/images/icons/ic_profile.png" [lazyLoad]="userInfo?.profile?.company_logo" />
            <p class="user-name">{{userInfo?.profile?.name}}</p>
        </div>
      <div class="menu-links" [routerLink]="['/panel/shop/profile']">
        <img src="/assets/images/icons/ic_profile.png" />
        <p>Profile</p>
      </div>
      <div class="menu-links" [routerLink]="['/panel/shop/wallet']">
        <img src="/assets/images/icons/wallet.svg" />
        <p>Wallet</p>
      </div>
    </div>
  </div>
</div>
