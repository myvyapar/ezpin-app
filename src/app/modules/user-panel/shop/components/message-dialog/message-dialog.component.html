<div class="message-dialog">
    <p class="title">{{data.title}}</p>
    <p class="description">
        {{data.description}}
    </p>
    <div class="buttons">
        <p class="cancel" (click)="cancelButton()">{{data.cancel}}</p>
        <p class="ok" (click)="okButton()">{{data.confirm}}</p>
    </div>
</div>
