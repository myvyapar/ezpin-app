<div class="search">
  <div class="container">
    <p class="back-button"><span (click)="backStep()">Back</span></p>

    <form [formGroup]="searchForm" (ngSubmit)="submitForm()">
      <input matInput placeholder="Search Gifts" formControlName="search" />
      <button>
        <img src="/assets/images/icons/ic_search.png" type="submit" />
      </button>
    </form>

    <div class="products">
      <div *ngFor="let product of products">
        <product-card [category]="product"></product-card>
      </div>
    </div>

    <p *ngIf="emptyList" class="emptyList">We couldn't find anything!</p>
  </div>
</div>
