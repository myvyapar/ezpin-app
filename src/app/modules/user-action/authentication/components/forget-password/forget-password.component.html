<div class="dialog">
  <p>Username Verification</p>
  <form [formGroup]="forgetPasswordForm" (ngSubmit)="submitForm()">
    <ion-input
      class="username-input"
      fill="outline"
      label="Username"
      labelPlacement="floating"
      autocomplete="username"
      formControlName="username"
    ></ion-input>
    <ion-button class="submit-button" expand="block" type="submit">SUBMIT</ion-button>
  </form>
</div>
